name: 📖 Docs issue
description: A page in the documentation is wrong, unclear, or missing something.
labels: ["docs"]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      description: The docs URL or page title. (The "Report an issue" button fills this in for you.)
      placeholder: /quickstart
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
      placeholder: The mount path in "Mounting your data drive" didn't match my compose file…
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
